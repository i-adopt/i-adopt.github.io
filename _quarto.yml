project:
  type: website
  output-dir: _site
  

website:
  site-url: "https://i-adopt.github.io/"
  repo-url: "https://github.com/i-adopt/i-adopt.github.io"
  repo-actions: [edit, issue]
  favicon: img/variable.png
  
  navbar:
    title: false
    logo: img/Logo.png
    left:
      - text: Overview
        href: overview.qmd
      - text: Roadmap
        href: roadmap.qmd
      - href: rda.qmd
        text: RDA Working Group
      - text: Ontology
        href: https://i-adopt.github.io/ontology/
      - text: Challenge
        href: challenge.qmd
      - text: Modelling Workshops
        href: workshops.qmd
      - text: Service
        href: service.qmd
      - text: News
        href: news.qmd
    tools:
      - icon: github
        href: https://github.com/i-adopt/i-adopt.github.io
        text: GFF Wiki GitHub
      - icon: rss
        href: https://i-adopt.github.io/news.xml
        text: GFF News RSS
  page-footer: 
    center: 
      - text: "About"
        href: about.qmd
      - text: "License: CC BY 4.0"
        href: https://creativecommons.org/licenses/by/4.0/


format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    link-external-icon: true
    link-external-newwindow: true
    
execute:
  freeze: auto



